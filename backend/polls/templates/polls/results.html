<h1>{{ question.question_text }}</h1>

<ul>
{% for choice in question.choices.all %}
    <li>
        <span style="display:inline-block;width:12px;height:12px;vertical-align:middle;border:1px solid #333;background:{% cycle '#e74c3c' '#3498db' '#2ecc71' '#f1c40f' '#9b59b6' '#1abc9c' '#e67e22' '#34495e' %};"></span>
        {{ choice.choice_text }} -- {{ choice.votes }} vote{{ choice.votes|pluralize }}
    </li>
{% endfor %}
</ul>

<a href="{% url 'polls:detail' question.id %}">Vote again?</a>
